<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo Comercial - ERP Target</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <h1>Módulo Comercial</h1>
      <nav class="nav-tabs">
        <button class="tab-btn active" data-tab="tab-comissoes">1. Comissões</button>
        <button class="tab-btn" data-tab="tab-estoque">2. Estoque</button>
        <button class="tab-btn" data-tab="tab-financeiro">3. Financeiro</button>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <!-- seçao 1: comissoes -->
    <section id="tab-comissoes" class="tab-content active">
      <h2>Cálculo de Comissões</h2>
      <!-- conteudo do desafio 1 -->
    </section>

    <!-- seçao 2: estoque -->
    <section id="tab-estoque" class="tab-content">
      <h2>Movimentação de Estoque</h2>
      <!-- conteudo do desafio 2 -->
    </section>

    <!-- seçao 3: financeiro -->
    <section id="tab-financeiro" class="tab-content">
      <h2>Cálculo de Juros</h2>
      <!-- conteudo do desafio 3 -->
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
